<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Actualización de pago</title></head>
<body style="margin:0;background:#f2f5f8;font-family:Arial,sans-serif;color:#243246">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 8px;background:#f2f5f8">
    <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#fff;border-radius:12px;overflow:hidden">
            <tr><td style="padding:20px 28px;background:#142d4e;text-align:center"><img src="cid:banner" alt="MooCode" style="display:block;max-width:100%;height:auto"></td></tr>
            <tr><td style="padding:28px">
                <h1 style="font-size:22px;margin:0 0 16px">Actualización de tu pago</h1>
                <p style="line-height:1.6">El pago <strong th:text="${paymentCode}">PAGO-000001</strong> para la factura <strong th:text="${invoiceCode}">FACT-000001</strong> fue actualizado.</p>
                <p style="font-size:18px"><strong>Estado: </strong><span th:text="${status}">CONFIRMADO</span></p>
                <p><strong>Importe: </strong><span th:text="${amount}">$0.00</span></p>
                <p th:if="${comment != null and !comment.isBlank()}" style="line-height:1.6"><strong>Comentario: </strong><span th:text="${comment}"></span></p>
                <p style="font-size:13px;color:#66758a;margin-top:28px">Este es un aviso automático del laboratorio académico MooCode.</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
