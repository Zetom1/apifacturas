<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificación de correo</title>
</head>
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px;background:#f4f6f8">
    <tr><td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:12px;overflow:hidden">
            <tr><td align="center" style="padding:22px;background:#101828">
                <img src="cid:banner" alt="MooCode" style="display:block;max-width:100%;height:auto">
            </td></tr>
            <tr><td style="padding:32px">
                <h1 style="margin:0 0 16px;font-size:22px">Código de seguridad</h1>
                <p style="font-size:15px;line-height:1.6">Usa este código para <span th:text="${purpose}">verificar tu correo</span>:</p>
                <p th:text="${code}" style="margin:24px 0;padding:16px;text-align:center;font-size:30px;font-weight:bold;letter-spacing:8px;background:#eef4ff;border-radius:8px">
                00000
                </p>
                <p style="font-size:14px;line-height:1.6">El código vence en <strong th:text="${expirationMinutes}">5
                </strong> minutos. Si no solicitaste este código, ignora este correo.</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
